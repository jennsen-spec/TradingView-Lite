<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#3A83F7">
<title>Chargement</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #3A83F7; overflow: hidden; overscroll-behavior: none; }
  #splash {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #3A83F7;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: opacity .45s ease, visibility .45s;
  }
  #splash.hidden { opacity: 0; visibility: hidden; }
  #mark { width: min(58vw, 62vh, 420px); aspect-ratio: 1; }
</style>
</head>
<body>
<div id="splash"><div id="mark"></div></div>
<script>
/* Logomark loading animation — self-contained, no dependencies.
   Logomark.mount(container, { duration, color, background }) -> { replay }  */
(function (root) {
  var PTS = [[87.3,-7.9],[86.7,-8.3],[86.1,-8.6],[85.5,-8.8],[84.9,-9.1],[84.3,-9.3],[83.6,-9.6],[83,-9.7],[82.3,-9.9],[81.6,-10.1],[80.9,-10.2],[80.1,-10.3],[79.4,-10.4],[78.6,-10.4],[77.8,-10.4],[77,-10.4],[76.2,-10.4],[75.4,-10.3],[74.5,-10.2],[73.6,-10.1],[72.8,-9.9],[71.9,-9.8],[71,-9.6],[70.1,-9.4],[69.1,-9.1],[68.2,-8.8],[67.2,-8.5],[66.3,-8.2],[65.3,-7.9],[64.4,-7.5],[63.4,-7.1],[62.4,-6.7],[61.4,-6.2],[60.4,-5.8],[59.4,-5.3],[58.4,-4.8],[57.4,-4.2],[56.4,-3.7],[55.4,-3.1],[54.4,-2.5],[53.4,-1.8],[52.4,-1.2],[51.3,-0.5],[50.3,0.2],[49.3,0.9],[48.3,1.6],[47.3,2.3],[46.3,3.1],[45.4,3.9],[44.4,4.6],[43.4,5.5],[42.4,6.3],[41.5,7.1],[40.5,8],[39.6,8.8],[38.6,9.7],[37.7,10.6],[36.8,11.5],[35.9,12.4],[35,13.4],[34.2,14.3],[33.3,15.3],[32.5,16.2],[31.6,17.2],[30.8,18.1],[30,19.1],[29.2,20.1],[28.5,21.1],[27.7,22.1],[27,23.1],[26.3,24.1],[25.6,25.1],[24.9,26.1],[24.3,27.1],[23.6,28.1],[23,29.1],[22.4,30.2],[21.9,31.2],[21.3,32.2],[20.8,33.2],[20.3,34.2],[19.8,35.2],[19.4,36.2],[18.9,37.1],[18.5,38.1],[18.2,39.1],[17.8,40.1],[17.5,41],[17.2,42],[16.9,42.9],[16.6,43.8],[16.4,44.8],[16.2,45.7],[16,46.6],[15.9,47.4],[15.7,48.3],[15.6,49.2],[15.6,50],[15.5,50.8],[15.5,51.7],[15.5,52.4],[15.5,53.2],[15.6,54],[15.7,54.7],[15.8,55.5],[15.9,56.2],[16.1,56.8],[16.3,57.5],[16.5,58.2],[16.7,58.8],[17,59.4],[17.3,60],[17.6,60.5],[18,61.1],[18.3,61.6],[18.7,62.1],[19.1,62.6],[19.6,63],[20,63.4],[20.5,63.8],[21,64.2],[21.6,64.6],[22.1,64.9],[22.7,65.2],[23.3,65.5],[23.9,65.7],[24.6,65.9],[25.2,66.1],[25.9,66.3],[26.6,66.5],[27.3,66.6],[28.1,66.7],[28.8,66.8],[29.6,66.8],[30.4,66.8],[31.2,66.8],[32,66.7],[32.9,66.7],[33.7,66.5],[34.6,66.3],[35.5,66.1],[36.3,65.8],[37.2,65.4],[38.1,64.9],[38.9,64.4],[39.8,63.7],[40.6,62.9],[41.4,62.1],[42.2,61.2],[43,60.2],[43.7,59.1],[44.4,57.9],[45.2,56.7],[45.8,55.4],[46.5,54.1],[47.1,52.7],[47.8,51.3],[48.4,49.9],[49,48.5],[49.6,47],[50.1,45.5],[50.7,44.1],[51.2,42.6],[51.8,41.1],[52.3,39.7],[52.8,38.2],[53.3,36.8],[53.7,35.5],[54.2,34.2],[54.7,32.9],[55.1,31.7],[55.6,30.6],[56.1,29.5],[56.5,28.6],[57,27.8],[57.5,27.1],[58.1,26.6],[58.7,26.2],[59.3,26.1],[60,26],[60.6,26.2],[61.3,26.5],[62,26.9],[62.6,27.4],[63.2,28],[63.8,28.6],[64.3,29.4],[64.8,30.2],[65.2,31.1],[65.7,32],[66.1,33],[66.4,34],[66.8,35.1],[67.1,36.2],[67.4,37.3],[67.6,38.5],[67.9,39.7],[68.1,40.9],[68.3,42.1],[68.5,43.4],[68.7,44.6],[68.8,45.9],[68.9,47.1],[69.1,48.4],[69.2,49.6],[69.3,50.8],[69.4,52],[69.5,53.2],[69.6,54.3],[69.7,55.3],[69.9,56.3],[70,57.1],[70.3,57.8],[70.6,58.4],[70.9,58.8],[71.3,59],[71.8,59],[72.4,58.9],[73,58.7],[73.6,58.4],[74.2,57.9],[74.9,57.4],[75.6,56.8],[76.3,56.1],[77,55.4],[77.7,54.6],[78.4,53.7],[79.1,52.8],[79.8,51.8],[80.6,50.8],[81.3,49.7],[82,48.5],[82.7,47.3],[83.5,46.1],[84.2,44.7],[84.9,43.4],[85.7,42],[86.4,40.5],[87.1,39],[87.8,37.4],[88.5,35.8],[89.2,34.2],[89.9,32.5],[90.6,30.8],[91.2,29.1],[91.9,27.3],[92.5,25.5],[93.2,23.6],[93.8,21.8],[94.4,19.9],[95,18]];
  var W0 = 0.35, W1 = 17, HH = 16.15, HL = 28.9, EXP = 1.65;
  var VIEWBOX = "8.71 -23.82 106.49 106.49";

  var cum = [0], i;
  for (i = 1; i < PTS.length; i++) cum.push(cum[i - 1] + Math.hypot(PTS[i][0] - PTS[i - 1][0], PTS[i][1] - PTS[i - 1][1]));
  var total = cum[cum.length - 1];
  function wAt(i) { return W0 + (W1 - W0) * Math.pow(cum[i] / total, EXP); }

  var L = [], R = [];
  for (i = 0; i < PTS.length; i++) {
    var a = PTS[Math.max(0, i - 1)], b = PTS[Math.min(PTS.length - 1, i + 1)];
    var dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1;
    var nx = -dy / dl, ny = dx / dl, h = wAt(i) / 2;
    L.push([PTS[i][0] + nx * h, PTS[i][1] + ny * h]);
    R.push([PTS[i][0] - nx * h, PTS[i][1] - ny * h]);
  }
  function f(n) { return Math.round(n * 100) / 100; }

  function roundPoly(Q, r) {
    var out = [Q[0]];
    for (var i = 1; i < Q.length - 1; i++) {
      var a = Q[i - 1], b = Q[i], c = Q[i + 1];
      var d1 = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, d2 = Math.hypot(c[0] - b[0], c[1] - b[1]) || 1;
      var r1 = Math.min(r, d1 * 0.42) / d1, r2 = Math.min(r, d2 * 0.42) / d2;
      var p1 = [b[0] + (a[0] - b[0]) * r1, b[1] + (a[1] - b[1]) * r1];
      var p2 = [b[0] + (c[0] - b[0]) * r2, b[1] + (c[1] - b[1]) * r2];
      for (var k = 0; k <= 10; k++) {
        var t = k / 10, m = 1 - t;
        out.push([m * m * p1[0] + 2 * m * t * b[0] + t * t * p2[0], m * m * p1[1] + 2 * m * t * b[1] + t * t * p2[1]]);
      }
    }
    out.push(Q[Q.length - 1]);
    return out;
  }

  function build(nEnd, k) {
    var n = Math.max(2, Math.min(PTS.length - 1, Math.round(nEnd)));
    var end = PTS[n], prev = PTS[Math.max(0, n - 3)];
    var ex = end[0] - prev[0], ey = end[1] - prev[1], el = Math.hypot(ex, ey) || 1;
    ex /= el; ey /= el;
    var nx = -ey, ny = ex, half = wAt(n) / 2, i;
    var d = ['M ' + f(L[0][0]) + ' ' + f(L[0][1])];
    for (i = 1; i < n; i++) d.push('L ' + f(L[i][0]) + ' ' + f(L[i][1]));
    if (k > 0.01) {
      var hh = half + (HH - half) * k, hl = HL * k, back = 2.6 * k;
      var head = roundPoly([L[n],
        [end[0] + nx * hh - ex * back, end[1] + ny * hh - ey * back],
        [end[0] + ex * hl, end[1] + ey * hl],
        [end[0] - nx * hh - ex * back, end[1] - ny * hh - ey * back], R[n]], 3.4 * k);
      for (i = 0; i < head.length; i++) d.push('L ' + f(head[i][0]) + ' ' + f(head[i][1]));
    } else {
      d.push('L ' + f(L[n][0]) + ' ' + f(L[n][1]));
      d.push('A ' + f(half) + ' ' + f(half) + ' 0 0 0 ' + f(R[n][0]) + ' ' + f(R[n][1]));
    }
    for (i = n - 1; i >= 0; i--) d.push('L ' + f(R[i][0]) + ' ' + f(R[i][1]));
    d.push('A ' + f(W0 / 2) + ' ' + f(W0 / 2) + ' 0 0 1 ' + f(L[0][0]) + ' ' + f(L[0][1]), 'Z');
    return d.join(' ');
  }

  function mount(container, opts) {
    opts = opts || {};
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', VIEWBOX);
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '100%');
    svg.setAttribute('aria-label', 'Chargement');
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('fill', opts.color || '#FFFFFF');
    svg.appendChild(path);
    container.appendChild(svg);
    if (opts.background) container.style.background = opts.background;

    var raf, guard, count = PTS.length - 1;
    var dur = (opts.duration || 2.4) * 1000;
    var loop = opts.loop !== false;
    function run() {
      cancelAnimationFrame(raf);
      clearTimeout(guard);
      // si rAF est gelé (onglet en arrière-plan), on affiche au moins la marque complète
      guard = setTimeout(function () { path.setAttribute('d', build(count, 1)); }, dur + 800);
      var t0 = performance.now();
      (function frame(now) {
        var t = Math.min(1, (now - t0) / dur);
        var e = Math.pow(t, opts.crescendo || 2);
        path.setAttribute('d', build(Math.max(2, e / 0.9 * count), Math.max(0, (e - 0.8) / 0.2)));
        if (t < 1) raf = requestAnimationFrame(frame);
        else { clearTimeout(guard); if (loop) setTimeout(run, opts.pause == null ? 700 : opts.pause); }
      })(performance.now());
    }
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) path.setAttribute('d', build(count, 1));
    else run();
    return { replay: run, stop: function () { cancelAnimationFrame(raf); clearTimeout(guard); }, svg: svg };
  }

  root.Logomark = { mount: mount, build: build, viewBox: VIEWBOX, full: build(PTS.length - 1, 1) };
})(window);

</script>
<script>
  var anim = Logomark.mount(document.getElementById('mark'), {
    duration: 2,
    crescendo: 2,
    color: '#FFFFFF',
    loop: true,
    pause: 1100
  });

  // Quand l'app est prête, masquer l'écran :
  // document.getElementById('splash').classList.add('hidden');
</script>
</body>
