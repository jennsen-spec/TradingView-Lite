name: Rapport mensuel

# Le signal se lit à la clôture de la dernière séance du mois ; Jean passe ses
# ordres à l'ouverture du lendemain. Le rapport doit donc être prêt le soir même.
#
# Cron ne sait pas dire « dernier jour ouvrable du mois » : on tourne les 28, 29,
# 30, 31, puis les 1er et 2, et le script décide s'il y a une nouvelle fin de mois
# complète. Rien n'est publié tant que le signal n'a pas changé, donc les passages
# inutiles ne coûtent qu'une minute et ne laissent aucune trace.
#
# PRÉ-RAPPORT (#96) — la VEILLE du dernier jour civil du mois (reculée au vendredi si
# elle tombe un samedi ou un dimanche), on publie une répétition : « qu'est-ce qu'on
# ferait si le mois se terminait aujourd'hui ? ». Cette veille peut tomber dès le 25
# (février), d'où la fenêtre élargie ci-dessous. UNE SEULE ligne de cron : deux lignes
# se déclencheraient toutes les deux le même soir sur les jours communs.
#
# Les jours 1 et 2 servent de rattrapage : si les barres du dernier jour n'étaient
# pas encore ingérées le 31, le passage suivant produit le bon signal et corrige.
#
# HEURE (26/08/2026) : 17 h 30 à Toronto, demandé par Jean — le rafraîchissement des
# cours tourne à 17 h. Cron ne connaît pas l'heure d'été : on lance DEUX passages,
# 21 h 30 et 22 h 30 UTC, soit 17 h 30 et 18 h 30 l'été, 16 h 30 et 17 h 30 l'hiver.
# Aucun calcul d'heure n'est nécessaire — c'est le contrôle de fraîcheur ci-dessous
# qui écarte le passage trop précoce, et le contrôle « signal inchangé » qui rend le
# passage en trop silencieux. L'heure locale utile est donc 17 h 30 toute l'année.
#
# FILET DE SÉCURITÉ (#100, 30/09/2026) — du 27 au 29/09 le workflow a échoué trois
# soirs de suite sans que personne le sache, et le pré-rapport n'est jamais parti.
#  · Tout passage en échec envoie maintenant une notification « rapport en ÉCHEC ».
#  · Le 22 de chaque mois, une RÉPÉTITION GÉNÉRALE fait tourner toute la chaîne sur
#    les vraies données (rapport + pré-rapport) SANS rien publier ni committer, et
#    notifie « répétition OK ». On sait avant la date butoir si le soir J marchera.
#    Le 22 est hors de la fenêtre 25→2 : la ligne de cron ne double aucun passage.
#  · À la main : Actions → Rapport mensuel → Run workflow, case « repetition »
#    (et « simuler_echec » pour vérifier que l'alerte d'échec arrive bien).

on:
  schedule:
    - cron: "30 21,22 25,26,27,28,29,30,31,1,2 * *" # 17 h 30 ET (voir la note sur l'heure d'été)
    - cron: "30 22 22 * *" # répétition générale du 22 (#100)
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions
    inputs:
      repetition:
        description: "Répétition générale : toute la chaîne, rien de publié"
        type: boolean
        default: false
      simuler_echec:
        description: "Faire échouer le passage pour tester l'alerte"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rapport
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      REPETITION: ${{ github.event.schedule == '30 22 22 * *' || inputs.repetition == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Garde-fou de fraîcheur. `calculerCycle` tolère jusqu'à 4 jours d'écart entre
      # la dernière barre et la fin du mois civil — indispensable pour les mois qui
      # se terminent un week-end, mais dangereux ici : un passage lancé AVANT le
      # rafraîchissement de 17 h prendrait la barre de l'avant-veille pour la fin du
      # mois et publierait un signal périmé sans rien signaler. On exige donc, un
      # jour de semaine, que la base porte bien une barre datée d'aujourd'hui.
      # Un jour férié la condition échoue : le passage de rattrapage du 1er s'en charge.
      # On lit la dernière barre de SPY, pas celle de toute la table : trier les ~650 000
      # barres journalières dépassait le délai de 3 s du rôle anon (erreur 500, curl
      # code 22) et a fait échouer tous les passages du 27 au 29/09/2026 — pré-rapport
      # compris. SPY passe par la clé primaire (ticker, interval, bar_date) : instantané.
      - name: Fraîcheur des données
        id: frais
        run: |
          set -euo pipefail
          BASE="https://cucshrxmtwwizzzqthcj.supabase.co/rest/v1/bars"
          CLE="sb_publishable_mbSe0WzTCQixT5Do_WILRg_U2F6DgTE"
          DERNIERE=$(curl -sf -H "apikey: $CLE" \
            "$BASE?select=bar_date&ticker=eq.SPY&interval=eq.1d&order=bar_date.desc&limit=1" \
            | sed -n 's/.*"bar_date":"\([0-9-]*\)".*/\1/p')
          AUJ=$(TZ=America/Toronto date +%F)
          JOUR=$(TZ=America/Toronto date +%u)
          echo "Dernière barre : ${DERNIERE:-aucune} · aujourd'hui : $AUJ (jour $JOUR)"
          if [ "$JOUR" -le 5 ] && [ "$DERNIERE" != "$AUJ" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cours pas encore rafraîchis ($DERNIERE) — passage suivant."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Le calendrier du soir : jour de pré-rapport (#96) ? passage utile tout court ?
      # La veille du dernier jour civil peut tomber un week-end — il n'y a alors pas de
      # clôture à lire, on recule au vendredi. Sans ce recul, un mois sur trois n'aurait
      # pas de pré-rapport (30/11/26, 31/01/27, 28/02/27…).
      # `actif` évite de faire tourner le rapport complet les soirs où il n'a rien à
      # faire : la fenêtre de cron couvre le pré-rapport, pas le rapport.
      - name: Quel jour sommes-nous
        id: jour
        run: |
          set -euo pipefail
          AUJ=$(TZ=America/Toronto date +%F)
          JJ=$(TZ=America/Toronto date +%-d)
          FIN=$(date -d "$(TZ=America/Toronto date +%Y-%m-01) +1 month -1 day" +%F)
          VEILLE=$(date -d "$FIN -1 day" +%F)
          DOW=$(date -d "$VEILLE" +%u)
          if [ "$DOW" -ge 6 ]; then VEILLE=$(date -d "$VEILLE -$((DOW - 5)) days" +%F); fi
          echo "Aujourd'hui $AUJ · fin de mois $FIN · veille retenue $VEILLE"
          if [ "$AUJ" = "$VEILLE" ]; then P=true; else P=false; fi
          if [ "$JJ" -ge 28 ] || [ "$JJ" -le 2 ] || [ "$P" = "true" ]; then A=true; else A=false; fi
          # Une répétition ne publie jamais, même lancée un soir de fenêtre.
          if [ "$REPETITION" = "true" ]; then P=false; A=false; fi
          echo "preavis=$P" >> "$GITHUB_OUTPUT"
          echo "actif=$A" >> "$GITHUB_OUTPUT"
          echo "::notice::pré-rapport ce soir : $P · passage utile : $A"

      # #60 — l'inventaire de l'univers tourne avant le rapport ; s'il trouve des
      # titres du duo absents de la base, le rapport porte une alerte visible.
      # Non bloquant : un pépin réseau chez Cboe ne doit pas empêcher le signal.
      - name: Inventaire de l'univers
        if: steps.frais.outputs.ok == 'true' && steps.jour.outputs.actif == 'true'
        run: npm run inventaire -- --max-yahoo 30 || echo "::warning::inventaire indisponible ce soir"

      - name: Générer le rapport
        id: gen
        if: steps.frais.outputs.ok == 'true' && steps.jour.outputs.actif == 'true'
        run: |
          set -euo pipefail
          AVANT=$(cat portefeuille/dernier-signal.txt 2>/dev/null || echo "aucun")
          # --frais : le runner est neuf, aucun cache — mais on l'écrit explicitement
          # pour que la commande soit la même à la main et ici.
          npm run rapport -- --frais --enregistrer
          APRES=$(cat portefeuille/dernier-signal.txt)
          echo "avant=$AVANT" >> "$GITHUB_OUTPUT"
          echo "apres=$APRES" >> "$GITHUB_OUTPUT"
          if [ "$AVANT" = "$APRES" ]; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signal inchangé ($APRES) — rien à publier."
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nouveau signal : $AVANT → $APRES"
          fi

      # DUO.MOM (#79) — instrument synthétique du chart : on régénère la courbe d'équité
      # base 100 (backtest du duo de production, même univers que le rapport). L'exporteur
      # recalcule toute l'histoire → le nouveau mois complet apparaît comme un point de plus.
      # Non bloquant : un pépin ne doit pas empêcher la publication du signal.
      - name: Actualiser la courbe DUO.MOM
        if: steps.gen.outputs.change == 'true'
        run: npm run duo:export || echo "::warning::export DUO.MOM indisponible ce soir"

      - name: Publier
        if: steps.gen.outputs.change == 'true'
        run: |
          set -euo pipefail
          git config user.name "TVLite"
          git config user.email "de.brunel@gmail.com"
          git add frontend/public/rapport.html frontend/public/rapport-meta.json portefeuille/dernier-signal.txt portefeuille/etat.json frontend/src/data/duo-mom.json
          git commit -m "rapport : signal du ${{ steps.gen.outputs.apres }}" \
                     -m "Généré automatiquement. Le cycle est inscrit dans etat.json ; \`execute\` reste vide jusqu'à ce que Jean rapporte ses exécutions réelles."
          git push

      # Notification aux appareils abonnés (#92). Après le commit : une notification
      # ratée ne doit pas faire échouer une publication réussie, d'où le `|| warning`.
      - name: Notifier les appareils
        if: steps.gen.outputs.change == 'true'
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: |
          if [ -z "${PUSH_SEND_SECRET:-}" ]; then
            echo "::warning::PUSH_SEND_SECRET absent — aucune notification envoyée."
            exit 0
          fi
          curl -fsS -X POST \
            "https://cucshrxmtwwizzzqthcj.supabase.co/functions/v1/tvlite-push/send" \
            -H "Content-Type: application/json" \
            -H "x-push-secret: ${PUSH_SEND_SECRET}" \
            -d "{\"titre\":\"TVLite — nouveau rapport\",\"corps\":\"Signal du ${{ steps.gen.outputs.apres }}\",\"signal\":\"${{ steps.gen.outputs.apres }}\"}" \
            || echo "::warning::envoi des notifications en échec — le rapport reste publié."

      # Les libellés de la collection « Duo Sec Momentum » suivent le signal publié.
      # Après le commit : si la poussée des libellés échoue, le rapport publié reste
      # valable et le passage suivant (signal inchangé) n'y reviendra pas — le README
      # de portefeuille/ documente la reprise manuelle : npm run collection -- --frais
      - name: Libellés de la collection
        if: steps.gen.outputs.change == 'true'
        run: npm run collection -- --frais

      # ── PRÉ-RAPPORT (#96) ────────────────────────────────────────────────────
      # Ne part QUE si le vrai rapport n'a rien publié ce soir : quand le mois est
      # complet, c'est lui qui parle et la répétition n'a plus d'objet. Pas de
      # `--frais` : l'étape précédente vient de rafraîchir le cache du runner.
      # Pas de `--enregistrer` non plus, et le script le refuse : un pré-rapport ne
      # décide rien, il ne doit inscrire aucun cycle dans etat.json.
      - name: Générer le pré-rapport
        id: preavis
        if: steps.frais.outputs.ok == 'true' && steps.jour.outputs.preavis == 'true' && steps.gen.outputs.change != 'true'
        run: |
          set -euo pipefail
          AVANT=$(cat portefeuille/dernier-preavis.txt 2>/dev/null || echo "aucun")
          npm run rapport -- --preavis
          APRES=$(cat portefeuille/dernier-preavis.txt 2>/dev/null || echo "aucun")
          echo "apres=$APRES" >> "$GITHUB_OUTPUT"
          if [ "$AVANT" = "$APRES" ]; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pré-rapport déjà publié sur la clôture du $APRES — rien à faire."
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pré-rapport sur la clôture du $APRES"
          fi

      - name: Publier le pré-rapport
        if: steps.preavis.outputs.change == 'true'
        run: |
          set -euo pipefail
          git config user.name "TVLite"
          git config user.email "de.brunel@gmail.com"
          # L'étape « Générer le rapport » tourne avec --enregistrer et a donc réécrit
          # le cycle courant dans etat.json (même contenu, date de publication du jour).
          # Un pré-rapport n'inscrit rien : on restaure le fichier avant de committer.
          git checkout -- portefeuille/etat.json portefeuille/dernier-signal.txt
          git add frontend/public/rapport.html frontend/public/rapport-meta.json portefeuille/dernier-preavis.txt
          git commit -m "pré-rapport : répétition du ${{ steps.preavis.outputs.apres }}" \
                     -m "Généré automatiquement, à titre indicatif. Aucun cycle n'est inscrit dans etat.json ; la section disparaît à la publication du rapport du mois."
          git push

      - name: Notifier les appareils (pré-rapport)
        if: steps.preavis.outputs.change == 'true'
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: |
          if [ -z "${PUSH_SEND_SECRET:-}" ]; then
            echo "::warning::PUSH_SEND_SECRET absent — aucune notification envoyée."
            exit 0
          fi
          curl -fsS -X POST \
            "https://cucshrxmtwwizzzqthcj.supabase.co/functions/v1/tvlite-push/send" \
            -H "Content-Type: application/json" \
            -H "x-push-secret: ${PUSH_SEND_SECRET}" \
            -d "{\"titre\":\"TVLite — pré-rapport\",\"corps\":\"Si le mois finissait aujourd'hui (clôture du ${{ steps.preavis.outputs.apres }})\",\"signal\":\"${{ steps.preavis.outputs.apres }}\"}" \
            || echo "::warning::envoi des notifications en échec — le pré-rapport reste publié."

      # ── RÉPÉTITION GÉNÉRALE (#100) ─────────────────────────────────────────
      # Mêmes commandes que le soir J, mais `--sortie` : seule la page demandée est
      # écrite, dans un dossier temporaire — ni rapport.html, ni marqueur, ni etat.json,
      # ni commit. Le contrôle de fraîcheur a déjà tourné plus haut : c'est lui qui a
      # cassé en septembre, la répétition le couvre donc aussi.
      - name: Répétition générale
        id: repet
        if: env.REPETITION == 'true'
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: |
          set -euo pipefail
          npm run inventaire -- --max-yahoo 30 || echo "::warning::inventaire indisponible"
          npm run rapport -- --frais --sortie "$RUNNER_TEMP/rapport.html"
          npm run rapport -- --preavis --sortie "$RUNNER_TEMP/preavis.html"
          test -s "$RUNNER_TEMP/rapport.html"
          test -s "$RUNNER_TEMP/preavis.html"
          if [ -z "${PUSH_SEND_SECRET:-}" ]; then
            echo "::error::PUSH_SEND_SECRET absent — le soir J, aucune notification ne partirait."
            exit 1
          fi
          echo "::notice::Répétition OK — rapport et pré-rapport générés, rien de publié."

      - name: Simuler un échec
        if: inputs.simuler_echec == true
        run: |
          echo "::error::Échec volontaire (test de l'alerte, #100)."
          exit 1

      - name: Notifier la répétition
        if: steps.repet.outcome == 'success'
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: |
          curl -fsS -X POST \
            "https://cucshrxmtwwizzzqthcj.supabase.co/functions/v1/tvlite-push/send" \
            -H "Content-Type: application/json" \
            -H "x-push-secret: ${PUSH_SEND_SECRET}" \
            -d "{\"titre\":\"TVLite — répétition OK\",\"corps\":\"La chaîne du rapport a tourné sans erreur le $(TZ=America/Toronto date +%d/%m). Rien n'a été publié.\"}"

      # Dernière ligne de défense, et la seule étape qui tourne quand une autre a
      # échoué : sans elle, un échec ne se voit que dans l'onglet Actions — c.-à-d. jamais.
      - name: Alerter en cas d'échec
        if: failure()
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: |
          curl -fsS -X POST \
            "https://cucshrxmtwwizzzqthcj.supabase.co/functions/v1/tvlite-push/send" \
            -H "Content-Type: application/json" \
            -H "x-push-secret: ${PUSH_SEND_SECRET}" \
            -d "{\"titre\":\"TVLite — rapport en ÉCHEC\",\"corps\":\"Le passage du $(TZ=America/Toronto date '+%d/%m à %H h %M') a échoué. Rien n'a été publié : voir GitHub Actions.\"}"

      - name: Rien à publier
        if: steps.frais.outputs.ok == 'true' && steps.jour.outputs.actif == 'true' && steps.gen.outputs.change != 'true' && steps.preavis.outputs.change != 'true'
        run: |
          echo "Le dernier signal complet est toujours ${{ steps.gen.outputs.apres }}."
          echo "Le rapport en ligne est à jour ; aucun commit."
