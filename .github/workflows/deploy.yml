name: Deploy TVLite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Un push fait par GITHUB_TOKEN ne redéclenche aucun workflow (garde-fou de
  # GitHub contre les boucles). Le rapport mensuel appelle donc le déploiement
  # explicitement à sa fin.
  workflow_run:
    workflows: ["Rapport mensuel"]
    types: [completed]

# Permissions requises par le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution de déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
