<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV-Like</title>
    <script>
      /* Applique le thème avant le premier paint → pas de flash. Clair par défaut (sombre si choisi). */
      try {
        if (localStorage.getItem("tvlike:theme") !== "dark")
          document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
