<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- TVLite — « le relief » : l'aire sous la courbe des prix.
       Une masse pleine plutôt qu'un trait : c'est ce qui survit à la réduction en 16 px.
       Le fond suit la barre d'onglets (prefers-color-scheme), pas le thème de l'app. -->
  <style>
    .fond  { fill: #f6f7f9; }
    .aire  { fill: #26a69a; opacity: .24; }
    .trait { stroke: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .fond  { fill: #131722; }
      .aire  { opacity: .38; }
      .trait { stroke: #26a69a; }
    }
  </style>
  <rect class="fond" width="48" height="48" rx="11"/>
  <path class="aire" d="M8 37 L19 23 L27 30 L40 11 L40 37 Z"/>
  <polyline class="trait" points="8,37 19,23 27,30 40,11" fill="none"
            stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
