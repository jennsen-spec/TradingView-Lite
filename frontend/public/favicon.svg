<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TVLite">
  <title>TVLite — bloc coupé</title>
  <!--
    Dessin repris de Bloc_Coupé.svg (Jean), mais la courbe est PEINTE, pas decoupee.
    L'original en fait un vide : elegant sur une page, mais dans une barre d'onglets
    le vide laisse passer le fond, gris quand l'onglet est inactif et blanc quand il
    est actif — la courbe changeait donc de couleur selon l'onglet.
    Tuile opaque a couleurs fixes, comme le favicon TradingView : la courbe reste
    blanche quel que soit l'etat de l'onglet et le theme du systeme.
  -->
  <defs><clipPath id="tuile"><rect width="64" height="64" rx="13"/></clipPath></defs>
  <g clip-path="url(#tuile)">
    <rect width="64" height="64" fill="#0a0a0c"/>
    <path d="M-8 74 L20 44 L34 54 L72 -8" fill="none" stroke="#ffffff"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
